<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    text-align:center;
}

input{
    padding:10px;
    width:220px;
    margin:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

.hidden{
    display:none;
}

.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<!-- Welcome Popup -->
<div id="welcomePopup" class="popup">
    <div class="popup-content">
        <h2>✨ Welcome ✨</h2>
        <p>Selamat datang di website rahasia.</p>
        <button onclick="startVerification()">Lanjut</button>
    </div>
</div>

<!-- Verifikasi -->
<div id="verification" class="container hidden">
    <h2>Masukkan Kode</h2>
    <input type="password" id="codeInput" placeholder="Masukkan kode">
    <br>
    <button onclick="checkCode()">Verifikasi</button>
</div>

<!-- Surprise -->
<div id="surprise" class="container hidden">
    <h1>🎉 Selamat! 🎉</h1>
    <p>Kamu berhasil masuk.</p>
    <h2>Ada sesuatu yang ingin aku sampaikan...</h2>
    <p>
        Terima kasih sudah menjadi bagian dari hidupku ❤️
    </p>
</div>

<script>
const secretCode = "Awatiniwinibiti";

function startVerification(){
    document.getElementById("welcomePopup").style.display = "none";
    document.getElementById("verification").classList.remove("hidden");
}

function checkCode(){
    const input = document.getElementById("codeInput").value;

    if(input === secretCode){
        document.getElementById("verification").classList.add("hidden");
        document.getElementById("surprise").classList.remove("hidden");
    }else{
        alert("Kode salah, anda tidak fantashhh 😔");
    }
}
</script>

</body>
</html>
